# =============================================================================
# Pila de FFC para produccion — cuatro contenedores y una sola puerta de entrada.
#
#   frontend-logistica  Angular servido por Nginx, que hace de proxy de /api/
#                       hacia el backend. Es el unico servicio que recibe
#                       trafico de fuera.
#   backend-logistica   Spring Boot 4 sobre Java 21.
#   bd-logistica        PostgreSQL 16.
#   redis-logistica     Redis 7, sesiones de los bots.
#
# Se aparta de compose.local.yml en tres cosas, y las tres son a proposito:
#
#   - Ningun `ports:`. El trafico entra por el proxy inverso del servidor, que
#     termina el HTTPS y llega al 80 de frontend-logistica por la red de
#     Docker. Publicar el 5432 o el 6379 dejaria Postgres y un Redis sin
#     contrasena abiertos a internet: Docker escribe sus propias reglas de
#     iptables y se salta el cortafuegos del sistema.
#   - Los secretos salen de `.env`, junto a este archivo, que solo existe en el
#     servidor y nunca se versiona. En local, el .env de la raiz es un enlace a
#     backend/.env.
#   - El volumen de Postgres lo crea este compose. El de compose.local.yml es
#     externo porque reutiliza el de desarrollo, y en una maquina limpia no
#     existe.
#
# Reparto de memoria, pensado para un servidor de 2 GB:
#
#   backend-logistica    896 MB   de los que ~490 son el heap de la JVM
#   bd-logistica         256 MB
#   redis-logistica       64 MB
#   frontend-logistica    48 MB
#   ------------------------------
#   total              1 264 MB   quedan ~700 MB para el sistema y para el pico
#                                 de la compilacion, que ocurre aqui mismo
#
# Los cuatro `mem_limit` no son decoracion. El de backend-logistica es ademas lo
# que la JVM lee para dimensionarse: sin el, mide los 2 GB del servidor y se
# reserva mas de la mitad para el heap, que despues no devuelve. En un servidor
# mas grande se suben estos numeros y la JVM se ajusta sola, sin tocar el
# Dockerfile.
#
# Sin container_name: dos pilas en la misma maquina no chocan por nombre, y los
# contenedores se siguen encontrando por el nombre del servicio, que es el que
# usan Nginx y el backend.
#
# Ni dominio ni certificado se declaran aqui: son asunto del proxy inverso.
#
# Validar:  docker compose -f compose.prod.yml config --quiet
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  bd-logistica:
    image: postgres:16-alpine
    restart: unless-stopped
    # Postgres reparte 128 MB de shared_buffers y admite 100 conexiones por
    # defecto, y cada conexion es un proceso aparte. Para un local con una
    # decena de pantallas eso es reservar para una carga que no llega.
    #
    # Veinte conexiones sobran: el pool del backend abre ocho como mucho, y las
    # que quedan son para un psql de mantenimiento. El numero importa porque
    # cada conexion cuesta memoria a los dos lados, y el techo de este
    # contenedor tiene que poder con todas a la vez.
    #
    # effective_cache_size no reserva nada: solo le dice al planificador con
    # cuanta cache del sistema puede contar.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=192MB
    mem_limit: 256m
    # Solo sus tres variables, no el .env entero: Postgres no tiene por que
    # tener a la vista los tokens de Discord ni el JWT_SECRET.
    #
    # `:?` detiene el arranque con un mensaje que nombra la variable, en vez de
    # levantar una base de datos sin contrasena.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en el .env}
      POSTGRES_USER: ${DB_USERNAME:?Falta DB_USERNAME en el .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
    volumes:
      - postgres_logistica_data:/var/lib/postgresql/data
    healthcheck:
      # El backend espera a que esto pase: sin ello arranca antes de que
      # Postgres acepte conexiones y muere en el primer intento.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  redis-logistica:
    image: redis:7-alpine
    restart: unless-stopped
    # Sin contrasena y sin volumen. Lo primero es aceptable solo porque no sale
    # de la red interna de este compose; lo segundo, porque guarda sesiones de
    # conversacion que caducan en minutos.
    #
    # `--save ""` apaga las instantaneas en disco. No solo sobran sin volumen:
    # para escribirlas Redis se bifurca, y durante la copia el sistema puede
    # tener que sostener dos veces sus datos. En un servidor justo, ese pico
    # periodico es justo lo que no se quiere.
    #
    # El tope con desalojo del menos usado convierte «Redis crecio sin freno» en
    # «se perdio la sesion mas vieja de un bot», que es un mal mucho menor:
    # quien la pierda solo tiene que repetir el ultimo paso de la conversacion.
    command:
      - redis-server
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------------------------------------------------------------------
  backend-logistica:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bd-logistica: { condition: service_healthy }
      redis-logistica: { condition: service_healthy }
    env_file: [.env]
    environment:
      # Dentro de la red de Docker los servicios se llaman por su nombre, no
      # por localhost. Estas lineas pisan lo que traiga el .env, que esta
      # escrito para ejecutar el backend fuera de Docker.
      SPRING_DATASOURCE_URL: jdbc:postgresql://bd-logistica:5432/${POSTGRES_DB}
      SPRING_DATA_REDIS_HOST: redis-logistica
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el .env}

      # application.properties la declara sin valor por defecto: si falta en
      # el entorno, el contenedor no arranca. Vacia, arranca y solo rechaza el
      # inicio con Google.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}

      # La siembra de produccion (SEED_ENABLED, encendida por defecto) es otra
      # cosa: roles, permisos, cargos, las secciones de la carta y los
      # alergenos. Esta es la de demostracion, que ademas crea los usuarios
      # admin, mozo1, chef1, caja1, almacen1 y repartidor1 con una contrasena
      # que esta escrita en el repositorio, que es publico. Encenderla en un
      # dominio abierto es dejar entrar como ADMIN a quien lea el README, asi
      # que se decide en el .env del servidor y por defecto esta apagada.
      SEED_DEMO: ${SEED_DEMO:-false}

      # En local el SQL y las peticiones van en DEBUG. En produccion llenarian
      # el log; LOG_NIVEL=DEBUG en el .env los vuelve a encender.
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: ${LOG_NIVEL:-INFO}
      LOGGING_LEVEL_COM_CHAQUENA_BACKEND_LOGISTICA: ${LOG_NIVEL:-INFO}

      # Fotos de la carta y logo del local, en su propio volumen.
      ARCHIVOS_DIRECTORIO: /aplicacion/archivos

      # Aunque el navegador hable solo con Nginx, manda la cabecera Origin en
      # todo POST, tambien del mismo origen, y Spring la valida contra esta
      # lista: sin el dominio aqui, entrar devuelve "Invalid CORS request".
      # Con `:?` el contenedor no arranca en vez de fallar recien en el login.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Falta CORS_ALLOWED_ORIGINS en el .env, con el dominio publico y su esquema}"

      # La direccion que se pega en el enlace de «olvide mi contrasena». Si
      # apunta a localhost, el correo llega con un enlace que solo funciona en
      # la maquina de quien lo mando.
      RECUPERACION_URL_BASE: "${RECUPERACION_URL_BASE:?Falta RECUPERACION_URL_BASE en el .env, con el dominio publico y su esquema}"
    volumes:
      - archivos_logistica:/aplicacion/archivos
    # El limite no es solo un freno: es el dato que la JVM lee para dimensionar
    # el heap. Las banderas del Dockerfile se calculan como porcentaje de este
    # numero, asi que borrar esta linea no «quita un limite», sino que deja a la
    # JVM midiendo el servidor entero y pidiendo mas de la mitad para ella.
    mem_limit: 896m
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------------------
  frontend-logistica:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend-logistica: { condition: service_started }
    # Nginx sirviendo estaticos apenas necesita memoria; el tope existe para que
    # no se coma lo que les falte a los otros si algo se descontrola.
    mem_limit: 48m
    # El proxy inverso entra por el 80 del contenedor. `expose` lo documenta
    # sin abrirlo en el host.
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  # Volumen con nombre y no carpeta del host: no depende de ninguna ruta del
  # servidor, sobrevive a cada redespliegue y se respalda como una unidad.
  postgres_logistica_data:
  # Las fotos de la carta y el logo: se respaldan junto con la base, porque
  # la base guarda a que fichero apunta cada platillo.
  archivos_logistica:
