spring.application.name=backend-logistica

# -------------------------------------------------------------
# 0. Carga de secretos
# -------------------------------------------------------------
# Los valores sensibles NO viven en este archivo: se leen de variables de
# entorno. Para desarrollo local se importa el archivo backend/.env
# (ignorado por git). Ver .env.example para la lista de claves requeridas.
spring.config.import=optional:file:./.env[.properties]

# -------------------------------------------------------------
# 1. Conexión a la Base de Datos PostgreSQL en Docker
# -------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------
# 2. Configuración de Hibernate / JPA
# -------------------------------------------------------------
# "update": Hibernate crea automáticamente todas las tablas según tus clases de domain/
spring.jpa.hibernate.ddl-auto=update

# Muestra en la terminal de Spring Boot las consultas SQL generadas
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto nativo para PostgreSQL 16
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------
# 3. Mensajeria de los bots
# -------------------------------------------------------------
# El negocio opera dos bots y no son intercambiables:
#
#   Bot IN  -> cuenta interna del personal. Control de stock, comandas del mozo
#              y tablero de cocina.
#   Bot OUT -> cuenta de cara al cliente. Carta, pedidos, delivery, tiempo
#              estimado y codigo OTP de entrega.
#
# Que servicio externo los transporta se decide aqui. WhatsApp cobra por
# conversacion y por eso el canal en servicio es Discord; el adaptador de
# WhatsApp sigue en el arbol y se enciende cambiando esta unica propiedad.
# Valores: discord | whatsapp | ninguno
app.mensajeria.proveedor=${MENSAJERIA_PROVEEDOR:discord}

# --- Discord (proveedor por defecto) ---
# Cada bot es una aplicacion distinta en https://discord.com/developers.
# En cada una hay que encender Bot > Privileged Gateway Intents > Message
# Content Intent: sin el, el arranque falla con "Disallowed intents" y se
# pierden los dos pasos de texto libre (cantidad de insumo y direccion).
discord.bot-in.token=${DISCORD_BOT_IN_TOKEN:}
discord.bot-out.token=${DISCORD_BOT_OUT_TOKEN:}

# Servidor donde registrar los comandos de barra del bot interno. Con guild-id
# aparecen al instante; sin el se registran globalmente y Discord tarda hasta
# una hora en propagarlos, lo que en una demostracion parece que no funciona.
discord.bot-in.guild-id=${DISCORD_GUILD_ID:}
discord.bot-out.guild-id=${DISCORD_GUILD_ID:}

# Canal donde se publican las comandas para cocina, con los botones de tomar,
# tiempo estimado y listo. Sin el, la comanda se crea igual pero cocina no se
# entera por el chat.
discord.canal-cocina=${DISCORD_CANAL_COCINA:}

# --- WhatsApp Cloud API (adaptador de reserva) ---
# Solo se usa con app.mensajeria.proveedor=whatsapp. Cada numero tiene su
# phone-number-id (identifica el numero emisor ante Meta) y su verify-token
# (la cadena del handshake del webhook).
whatsapp.api.url=${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}

whatsapp.bot-in.phone-number-id=${WHATSAPP_BOT_IN_PHONE_NUMBER_ID:}
whatsapp.bot-in.token=${WHATSAPP_BOT_IN_TOKEN:}
whatsapp.bot-in.verify-token=${WHATSAPP_BOT_IN_VERIFY_TOKEN:}

whatsapp.bot-out.phone-number-id=${WHATSAPP_BOT_OUT_PHONE_NUMBER_ID:}
whatsapp.bot-out.token=${WHATSAPP_BOT_OUT_TOKEN:${WHATSAPP_BOT_IN_TOKEN:}}
whatsapp.bot-out.verify-token=${WHATSAPP_BOT_OUT_VERIFY_TOKEN:}

# -------------------------------------------------------------
# 4. Google OAuth 2.0 - Verificación de tokens de Google
# -------------------------------------------------------------
google.oauth2.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# -------------------------------------------------------------
# 5. JWT del Backend - Tokens propios emitidos por esta API
# -------------------------------------------------------------
# Clave secreta para firmar los JWT del backend (mínimo 256 bits / 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# -------------------------------------------------------------
# 6. Logging de peticiones HTTP globales
# -------------------------------------------------------------
logging.level.org.springframework.web=DEBUG
logging.level.com.chaquena.backend_logistica=DEBUG

# -------------------------------------------------------------
# 7. Frontend, seguridad y procesos de fondo
# -------------------------------------------------------------
# Origenes del Angular. frontend-logistica va en el 81 y frontend-facturacion
# en el 80; 4200 es el servidor de desarrollo de Angular.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:81,http://localhost:80,http://localhost:4200}

# Siembra roles, permisos y cargos base solo si las tablas estan vacias.
app.seed.enabled=${SEED_ENABLED:true}

# Datos de demostracion (personal, carta, stock, mesas, clientes y comandas de
# ejemplo). Solo para desarrollo: no se siembra nada si ya hay platillos.
app.seed.demo=${SEED_DEMO:false}

# Worker de outbox. Queda apagado mientras backend-facturacion no exista:
# el mecanismo esta escrito y se enciende cambiando esta propiedad.
app.outbox.enabled=${OUTBOX_ENABLED:false}
app.outbox.destino-url=${OUTBOX_DESTINO_URL:}
app.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:15000}
app.outbox.tamano-lote=${OUTBOX_TAMANO_LOTE:20}
app.outbox.max-reintentos=${OUTBOX_MAX_REINTENTOS:5}

# -------------------------------------------------------------
# 8. Contrato OpenAPI y sonda de salud
# -------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# El generador typescript-angular del frontend consume OpenAPI 3.0; springdoc
# emite 3.1 por defecto y ese generador todavia no lo parsea limpio.
springdoc.api-docs.version=openapi_3_0
# Claves ordenadas: hace que dos descargas seguidas del contrato den un diff
# vacio y solo se vean los cambios reales.
springdoc.writer-with-order-by-keys=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
