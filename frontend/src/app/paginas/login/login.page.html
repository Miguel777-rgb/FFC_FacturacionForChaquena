<main class="entrada">
  <form class="tarjeta" [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
    <header>
      <p class="marca">Chaquena</p>
      <h1>Logistica</h1>
      <p class="subtitulo">Entra con tu usuario del local.</p>
    </header>

    <label>
      <span>Usuario o correo</span>
      <input
        type="text"
        formControlName="usernameOrEmail"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        [attr.aria-invalid]="
          formulario.controls.usernameOrEmail.touched && formulario.controls.usernameOrEmail.invalid
        "
      />
    </label>

    <label>
      <span>Contrasena</span>
      <div class="campo-contrasena">
        <input
          [type]="contrasenaVisible() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="
            formulario.controls.password.touched && formulario.controls.password.invalid
          "
        />
        <button
          type="button"
          class="alternar"
          (click)="alternarVisibilidad()"
          [attr.aria-label]="contrasenaVisible() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
          [attr.aria-pressed]="contrasenaVisible()"
        >
          @if (contrasenaVisible()) {
            <!-- Ojo tachado: la contrasena esta visible, pulsar oculta. -->
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 6c-5 0-9.27 3.11-11 7.5 1.2 3.05 3.6 5.5 6.6 6.79l1.4-1.4C6.7 17.7 4.8 15.86 3.73 13.5 5.16 10.36 8.3 8 12 8c1.06 0 2.07.2 3 .56L13.6 10A4 4 0 0 0 10 15.6l-2.02 2.02C6.9 18.16 5.83 18.5 4.7 18.7l-.02.02M12 18c5 0 9.27-3.11 11-7.5a13.3 13.3 0 0 0-3.4-4.8l1.7-1.7-1.4-1.4L2.7 19.9l1.4 1.4 2.2-2.2C7.9 19.6 9.9 20 12 20c.34 0 .67-.02 1-.05l1.9-1.9c-.94.3-1.9.45-2.9.45a9.9 9.9 0 0 1-3.02-.47l1.6-1.6A4 4 0 0 0 14 12.4l3.9-3.9a11.4 11.4 0 0 1 2.4 3.5C18.84 15.64 15.7 18 12 18Z"
              />
            </svg>
          } @else {
            <!-- Ojo abierto: la contrasena esta oculta, pulsar muestra. -->
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 6c5 0 9.27 3.11 11 7.5-1.73 4.39-6 7.5-11 7.5S2.73 17.89 1 13.5C2.73 9.11 7 6 12 6Zm0 2c-3.7 0-6.84 2.36-8.27 5.5C5.16 16.64 8.3 19 12 19s6.84-2.36 8.27-5.5C18.84 10.36 15.7 8 12 8Zm0 1.5a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"
              />
            </svg>
          }
        </button>
      </div>
    </label>

    @if (error(); as textoError) {
      <p class="error" role="alert">{{ textoError }}</p>
    }

    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando...' : 'Entrar' }}
    </button>

    @if (google.disponible()) {
      <p class="separador"><span>o</span></p>

      <button type="button" class="google" [disabled]="enviando()" (click)="entrarConGoogle()">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false">
          <path
            fill="#4285F4"
            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"
          />
          <path
            fill="#34A853"
            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18Z"
          />
          <path
            fill="#FBBC05"
            d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34Z"
          />
          <path
            fill="#EA4335"
            d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58Z"
          />
        </svg>
        Ingresar con Google
      </button>
    }
  </form>
</main>
