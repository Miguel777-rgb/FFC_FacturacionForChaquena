<section class="trastienda">
  <header class="cabecera">
    <h1>{{ titulo() }}</h1>
  </header>

  <!-- Pestanas y no un menu lateral propio: el panel de la izquierda ya navega
       entre superficies, y anidar dos navegaciones verticales confunde de cual
       se sale al pulsar atras. -->
  <nav class="pestanas" [attr.aria-label]="t('trastienda.secciones')">
    @for (p of pestanas(); track p.id) {
      <button
        type="button"
        [class.activa]="activa() === p.id"
        [attr.aria-current]="activa() === p.id ? 'page' : null"
        (click)="abrir(p.id)"
      >
        {{ t(p.nombre) }}
      </button>
    }
  </nav>

  <!-- Cada seccion pide lo suyo al montarse: `@if` y no `[hidden]` para que
       entrar a corregir un precio no descargue el kardex entero. -->
  @switch (activa()) {
    @case ('inventario') {
      <app-inventario-seccion />
    }
    @case ('carta') {
      <app-carta-seccion />
    }
    @case ('local') {
      <app-local-seccion />
    }
    @case ('bots') {
      <app-bots-seccion />
    }
    @case ('outbox') {
      <app-outbox-seccion />
    }
  }
</section>
