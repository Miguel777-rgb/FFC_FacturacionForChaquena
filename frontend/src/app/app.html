@if (sesion.autenticado()) {
  <!-- PC: panel lateral a la izquierda. Celular: barra superior con el menu en
       un cajon. Los dos llevan dentro el idioma y el tema, asi que nada flota
       encima del contenido. -->
  <div class="marco">
    <app-panel-lateral />
    <div class="contenido">
      <app-barra-superior />
      <main>
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
  <!-- Sin sesion no hay panel: en la pantalla de entrar el idioma flota. -->
  <app-barra-idiomas />
}

<app-pila-avisos />

<!-- La confirmacion de peligro no se monta aqui: ConfirmacionService la
     descarga y la cuelga de <body> la primera vez que alguien la pide. -->
