@if (sesion.autenticado()) {
  <!-- PC: panel lateral a la izquierda. Celular: barra superior con el menu en
       un cajon. Los dos llevan dentro el idioma y el tema, asi que nada flota
       encima del contenido. -->
  <div class="marco">
    <app-panel-lateral />
    <div class="contenido">
      <app-barra-superior />
      <app-aviso-inactividad />
      <main>
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <!-- Sin sesion no hay panel: en la pantalla de entrar el desplegable de
       idioma flota. Va dentro de <main> para que nada quede fuera de una
       region. -->
  <main>
    <router-outlet />
    <app-selector-idioma />
  </main>
}

<app-pila-avisos />

<!-- La confirmacion de peligro no se monta aqui: ConfirmacionService la
     descarga y la cuelga de <body> la primera vez que alguien la pide. -->
