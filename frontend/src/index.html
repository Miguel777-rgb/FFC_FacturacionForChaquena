<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Chaquena · Logistica</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- El icono de la pestana cuando no hay sesion; con ella,
         IconoPestanaService pone en este mismo enlace el logo del local. Sin
         type, porque el logo subido es WebP. Nginx cachea los .ico 365 dias
         como inmutables: un icono nuevo necesita otro nombre de archivo, no el
         mismo nombre con otro contenido. -->
    <link rel="icon" href="chaquena.ico" />

    <!-- Inter es la letra del texto y de los botones: se adelanta para que la
         primera pantalla no se pinte con la del sistema y luego salte. -->
    <link
      rel="preload"
      href="fuentes/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Google Identity Services: da el access token que /api/v1/auth/google
       espera en la cabecera Authorization. Se carga aqui y no bajo demanda
       porque la pantalla de login es la primera que se pinta. Si no hay
       conexion, el boton de Google no aparece y el login con usuario y
       contrasena sigue funcionando. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
