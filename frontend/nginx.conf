# =============================================================================
# Nginx del frontend-logistica.
#
# Hace dos cosas: sirve la SPA y actua de proxy hacia el backend. Ese proxy es
# lo que permite que environment.ts de produccion tenga apiBasePath vacio: el
# navegador habla solo con este origen, asi que no hay peticiones cruzadas ni
# CORS que configurar, y el backend no necesita estar publicado a internet.
# =============================================================================

server {
    listen 80;
    server_name _;

    # DNS interno de Docker. Resolver el nombre en cada peticion, y no una vez
    # al arrancar, evita dos problemas reales: que Nginx se niegue a arrancar
    # si el backend todavia no existe, y que se quede pegado a una IP vieja
    # cuando el contenedor del backend se reinicia y Docker le da otra.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend-logistica:8080";

    root /usr/share/nginx/html;
    index index.html;

    # Sin esto un tercero puede embeber la aplicacion en un iframe y capturar
    # las pulsaciones del mozo sobre lo que cree que es su propia pantalla.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cuando el KDS pase de polling a SSE, la respuesta es un flujo que no
        # termina: con buffering activado Nginx se lo guardaria entero y la
        # pantalla de cocina no recibiria nada.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }

    # Contrato y documentacion, para poder correr `pnpm api:sync` contra el
    # despliegue en lugar de contra un backend local.
    location /v3/api-docs {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    location /swagger-ui {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    # --- Estaticos ---------------------------------------------------------
    # Los bundles llevan hash en el nombre: cambian de nombre al cambiar de
    # contenido, asi que se pueden cachear para siempre sin miedo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html no se cachea: es lo unico que apunta a los bundles nuevos, y
    # si el navegador se queda con uno viejo la aplicacion no se actualiza nunca.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Enrutado del lado del cliente: cualquier ruta que no sea un fichero real
    # la resuelve Angular. Sin esto, recargar en /kds da un 404 de Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
