# Nginx del frontend-logistica: sirve la SPA y hace de proxy al backend. El navegador habla con un
# solo origen, sin CORS, y el backend no necesita estar publicado a internet.

server {
    listen 80;
    server_name _;

    # DNS de Docker resuelto en cada peticion: Nginx arranca aunque el backend aun no exista y no se
    # queda pegado a una IP vieja cuando el contenedor se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend-logistica:8080";

    root /usr/share/nginx/html;
    index index.html;

    # Sin esto un tercero puede embeber la aplicacion en un iframe y capturar
    # las pulsaciones del mozo sobre lo que cree que es su propia pantalla.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- WebSocket del llamado: sus propias cabeceras, porque /api/ fuerza `Connection ""` para el SSE
    # y sin `Upgrade` el saludo no llega al backend como WebSocket.
    location /api/v1/ws {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La conexion vive horas; los latidos STOMP cada 10 s la mantienen
        # ocupada, asi que este plazo solo corta las que de verdad murieron.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El SSE es un flujo que no termina: con buffering activado Nginx lo guardaria entero y la
        # pantalla no recibiria nada.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";

        # Las fotos de la carta suben por aqui. Nginx corta en 1 MB por defecto
        # y el backend acepta 2; el resto es margen para el envoltorio multipart.
        client_max_body_size 3m;
    }

    # Contrato y documentacion, para poder correr `pnpm api:sync` contra el
    # despliegue en lugar de contra un backend local.
    location /v3/api-docs {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    location /swagger-ui {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    # --- Estaticos: llevan hash en el nombre, asi que se cachean para siempre sin miedo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html no se cachea: es lo unico que apunta a los bundles nuevos, y
    # si el navegador se queda con uno viejo la aplicacion no se actualiza nunca.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Enrutado del lado del cliente: cualquier ruta que no sea un fichero real
    # la resuelve Angular. Sin esto, recargar en /kds da un 404 de Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
